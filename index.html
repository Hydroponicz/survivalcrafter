<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survivalcrafter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪓</text></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="tour-fade"></div>
    <div id="loading" class="loading-screen">
      <h1 class="menu-title">Survivalcrafter</h1>
      <div class="load-bar"><i id="load-fill"></i></div>
      <p id="load-text">Loading…</p>
    </div>
    <div id="menu" class="main-menu waiting">
      <h1 class="menu-title">Survivalcrafter</h1>
      <div class="menu-panel" data-panel="main">
        <button id="continue" disabled>Continue</button>
        <button data-go="new">New game</button>
        <button id="load">Load game</button>
        <button data-go="settings">Settings</button>
        <button data-go="wiki">Wiki</button>
        <button id="exit">Exit game</button>
      </div>
      <div class="menu-panel" data-panel="new" hidden>
        <h2>New game</h2>
        <label class="menu-field">World seed<input id="seed" placeholder="Random" autocomplete="off" /></label>
        <p class="menu-note">Leave it empty for a random world, or enter a seed (a number or any words) to make that world again.</p>
        <button id="create">Create world</button>
        <button data-go="main">Back</button>
      </div>
      <div class="menu-panel" data-panel="settings" hidden>
        <h2>Settings</h2>
        <button id="set-quality">Graphics</button>
        <button id="set-fps">Frame cap</button>
        <button id="set-sound">Sound</button>
        <button data-go="main">Back</button>
      </div>
      <div class="menu-panel menu-wiki" data-panel="wiki" hidden>
        <h2>Wiki</h2>
        <div class="wiki-body"></div>
        <button data-go="main">Back</button>
      </div>
      <p class="status" id="menu-status"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
